<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>Authorize · local-shell-mcp</title>
  <link rel="icon" type="image/svg+xml" href="$favicon_url" />
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-synthesis: none;
      --page: #f4f7f9;
      --page-glow: rgba(69, 173, 158, .13);
      --surface: #ffffff;
      --border: #e1e7eb;
      --text: #17252e;
      --muted: #667781;
      --subtle: #8a9aa4;
      --accent: #087c70;
      --accent-hover: #06685f;
      --accent-text: #ffffff;
      --field: #f9fbfc;
      --field-border: #ccd7dd;
      --ring: rgba(8, 124, 112, .16);
      --symbol-bg: #e9f7f2;
      --shadow: 0 26px 70px rgba(32, 59, 68, .075), 0 3px 12px rgba(32, 59, 68, .035);
      --error-bg: #fff2f1;
      --error-border: #facdca;
      --error-text: #a23a36;
      --warning-bg: #fffaea;
      --warning-border: #f0dfaa;
      --warning-text: #735817;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --page: #0b1219;
        --page-glow: rgba(21, 155, 137, .10);
        --surface: #121d26;
        --border: #283943;
        --text: #ecf3f5;
        --muted: #a1b1ba;
        --subtle: #8297a2;
        --accent: #4ad2b4;
        --accent-hover: #73e1c7;
        --accent-text: #092721;
        --field: #0e1820;
        --field-border: #344751;
        --ring: rgba(74, 210, 180, .15);
        --symbol-bg: #183d39;
        --shadow: 0 28px 76px rgba(0, 0, 0, .27), 0 3px 12px rgba(0, 0, 0, .14);
        --error-bg: #341e22;
        --error-border: #744044;
        --error-text: #ffb1ac;
        --warning-bg: #302819;
        --warning-border: #6d552d;
        --warning-text: #f0d394;
      }
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 32px 20px;
      background: radial-gradient(ellipse 560px 370px at 50% 20%, var(--page-glow), transparent 95%), var(--page);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }
    main { width: min(100%, 440px); }
    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 27px;
      font-size: 14px;
      font-weight: 730;
      letter-spacing: -.02em;
    }
    .brand-mark {
      display: grid;
      place-items: center;
      width: 33px;
      height: 33px;
      border-radius: 10px;
      overflow: hidden;
    }
    .brand-mark img { display: block; width: 100%; height: 100%; }
    .card {
      padding: 38px 36px 34px;
      border: 1px solid var(--border);
      border-radius: 22px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }
    .symbol {
      display: grid;
      place-items: center;
      width: 54px;
      height: 54px;
      margin: 0 auto 23px;
      border-radius: 17px;
      background: var(--symbol-bg);
      color: var(--accent);
    }
    h1 {
      margin: 0;
      font-size: clamp(24px, 5vw, 28px);
      line-height: 1.25;
      letter-spacing: -.045em;
      text-align: center;
      font-weight: 740;
    }
    .lead {
      margin: 12px 0 30px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
      text-align: center;
      overflow-wrap: anywhere;
    }
    .lead strong { color: var(--text); font-weight: 690; }
    .field { display: block; }
    .field > span {
      display: block;
      margin-bottom: 9px;
      color: var(--text);
      font-size: 13px;
      font-weight: 660;
    }
    .field input {
      display: block;
      width: 100%;
      height: 50px;
      padding: 0 15px;
      border: 1px solid var(--field-border);
      border-radius: 11px;
      outline: 0;
      background: var(--field);
      color: var(--text);
      font: inherit;
      font-size: 15px;
      letter-spacing: .025em;
      transition: border-color .16s ease, box-shadow .16s ease;
    }
    .field input::placeholder { color: var(--subtle); letter-spacing: normal; }
    .field input:focus-visible { border-color: var(--accent); box-shadow: 0 0 0 4px var(--ring); }
    .submit {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      min-height: 50px;
      margin-top: 22px;
      padding: 12px 18px;
      border: 0;
      border-radius: 11px;
      background: var(--accent);
      color: var(--accent-text);
      font: inherit;
      font-size: 14px;
      font-weight: 720;
      cursor: pointer;
      transition: background .16s ease, transform .16s ease;
    }
    .submit:hover { background: var(--accent-hover); }
    .submit:active { transform: translateY(1px); }
    .submit:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
    .submit svg { flex: none; }
    .notice {
      margin-bottom: 20px;
      padding: 12px 14px;
      border: 1px solid;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.5;
    }
    .notice-error { background: var(--error-bg); border-color: var(--error-border); color: var(--error-text); }
    .notice-warning { background: var(--warning-bg); border-color: var(--warning-border); color: var(--warning-text); }
    .footnote {
      margin: 21px 0 0;
      color: var(--subtle);
      font-size: 12px;
      line-height: 1.5;
      text-align: center;
    }
    @media (max-width: 480px) {
      body { padding: 24px 16px; }
      .brand { margin-bottom: 22px; }
      .card { padding: 32px 23px 28px; border-radius: 19px; }
      .lead { margin-bottom: 26px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; }
    }
  </style>
</head>
<body>
  <main>
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"><img src="$logo_url" alt="" /></span>
      <span>local-shell-mcp</span>
    </div>
    <section class="card" aria-labelledby="authorization-title">
      <div class="symbol" aria-hidden="true">
        <svg width="27" height="27" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="5" y="10" width="14" height="11" rx="2.5" />
          <path d="M8 10V7a4 4 0 0 1 8 0v3" />
          <path d="M12 14v3" />
        </svg>
      </div>
      <h1 id="authorization-title">Authorize connection</h1>
      <p class="lead"><strong>$client_name</strong> wants to access your workspace.</p>
      $error_html
      <form method="post" action="/oauth/authorize">
        $hidden_inputs
        $pin_field
        <button class="submit" type="submit">
          <span>Approve access</span>
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M5 12h14m-6-6 6 6-6 6" />
          </svg>
        </button>
      </form>
      <p class="footnote">Only approve clients you trust.</p>
    </section>
  </main>
</body>
</html>
